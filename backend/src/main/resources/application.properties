spring.application.name=cultural-museum

# connect file docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# dynamically create table depends on code Java
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai

# Chat Model (LLM)
spring.ai.openai.chat.options.model=gemini-3.5-flash
spring.ai.openai.chat.options.temperature=0.7

# Embedding Model (RAG) - BẮT BUỘC KHAI BÁO DIMENSIONS
spring.ai.openai.embedding.options.model=gemini-embedding-001
spring.ai.openai.embedding.options.dimensions=768

# 2. Cấu hình pgVector Store (Đồng bộ chuẩn 768 chiều với HNSW)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
# Supply a fresh random HMAC secret of at least 32 UTF-8 bytes.
museum.jwt.secret=${MUSEUM_JWT_SECRET}
